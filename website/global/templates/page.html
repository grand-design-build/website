<!-- Starting point for a new page. Copy it to its own folder, e.g.
     services/home-addition/index.html  ->  /services/home-addition/
     Fill in the five page-specific tags below, write the middle, then run
     python3 tools/build.py to stamp the header and footer in.

     To build a page with NO header (a bare landing page, say), delete the
     header marker pair. Same for the footer. Keep the head marker on every
     page - that is what loads the fonts, the stylesheet and analytics. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAGE TITLE | Grand Design Build</title>
<meta name="description" content="PAGE DESCRIPTION, 150-160 characters.">
<link rel="canonical" href="https://granddesignbuild.com/PATH/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Grand Design Build">
<meta property="og:title" content="PAGE TITLE | Grand Design Build">
<meta property="og:description" content="PAGE DESCRIPTION, 150-160 characters.">
<meta property="og:url" content="https://granddesignbuild.com/PATH/">
<meta property="og:image" content="https://granddesignbuild.com/images/hero-storefront.webp">
<meta name="twitter:card" content="summary_large_image">

<!-- #include head -->
<!-- /include head -->
</head>
<body>

<!-- #include header -->
<!-- /include header -->

<section>
  <div class="wrap">
    <p class="eyebrow">Eyebrow</p>
    <h2 class="sec-title">Page heading</h2>
    <p class="sec-sub">Page content goes here.</p>
  </div>
</section>

<!-- #include footer -->
<!-- /include footer -->

</body>
</html>
